<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caffè Tracker Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #090d16;
      color: #f1f5f9;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    .glass-pill {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .amber-glow {
      box-shadow: 0 0 35px -5px rgba(245, 158, 11, 0.35);
    }
    .btn-gradient {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px -5px rgba(245, 158, 11, 0.5);
    }
    .btn-gradient:active {
      transform: translateY(1px);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(245, 158, 11, 0.3);
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-3 sm:p-6 pb-12 selection:bg-amber-500 selection:text-slate-950">

  <!-- Header Branding -->
  <header class="w-full max-w-lg flex items-center justify-between py-4 px-2 mb-2">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-amber-500/20">
        <i class="fa-solid fa-mug-hot"></i>
      </div>
      <div>
        <h1 class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
          BARISTA <span class="text-xs px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 font-bold uppercase tracking-widest">SaaS Edition</span>
        </h1>
        <p class="text-xs text-slate-400 font-medium">Gestione Turni Lun-Ven • Squad Tracker</p>
      </div>
    </div>
    <button onclick="resetData()" title="Reset Dati" class="w-9 h-9 rounded-xl glass-pill flex items-center justify-center text-slate-400 hover:text-rose-400 hover:border-rose-500/30 transition">
      <i class="fa-solid fa-rotate-right text-sm"></i>
    </button>
  </header>

  <main class="w-full max-w-lg space-y-5">

    <!-- HERO CARD: TURNO ODIERNO -->
    <div class="glass-card rounded-3xl p-6 text-center relative overflow-hidden amber-glow">
      <div class="absolute -top-24 -right-24 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-amber-600/10 rounded-full blur-3xl pointer-events-none"></div>

      <div class="flex justify-between items-center text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
        <span id="current-date-str" class="flex items-center gap-1.5"><i class="fa-regular fa-calendar text-amber-400"></i> --/--/----</span>
        <span class="px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-bold">Lavoro Attivo</span>
      </div>

      <div class="py-4">
        <p class="text-xs uppercase tracking-widest font-bold text-slate-400 mb-1">Oggi il caffè lo offre</p>
        <div id="hero-payer" class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-500 tracking-tight my-1 py-1">
          --
        </div>
        <p id="hero-subtitle" class="text-xs text-slate-400 mt-1">Nessun costo per gli altri due compagni!</p>
      </div>

      <!-- Action Buttons -->
      <div class="grid grid-cols-1 sm:grid-cols-5 gap-2 pt-2">
        <button onclick="confirmAndShare()" class="sm:col-span-3 btn-gradient text-slate-950 font-black py-3.5 px-4 rounded-2xl shadow-xl flex items-center justify-center space-x-2 text-sm tracking-wide">
          <i class="fa-solid fa-check-double text-base"></i>
          <span>PAGATO & CONDIVIDI WA</span>
        </button>
        <button onclick="skipTurn()" class="sm:col-span-2 glass-pill text-slate-300 hover:text-white font-bold py-3.5 px-3 rounded-2xl border border-slate-700/60 hover:bg-slate-800 transition flex items-center justify-center space-x-1.5 text-xs">
          <i class="fa-solid fa-forward text-amber-400"></i>
          <span>Salta Oggi</span>
        </button>
      </div>
    </div>

    <!-- STATISTICHE & BALANCE COUNTER -->
    <div class="glass-card rounded-3xl p-5 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-extrabold text-slate-400 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-chart-pie text-amber-400"></i> Bilancio Caffè Pagati
        </h2>
        <span id="total-coffees-badge" class="text-xs font-bold text-amber-400 bg-amber-400/10 px-2.5 py-0.5 rounded-full border border-amber-400/20">0 Totali</span>
      </div>

      <div class="grid grid-cols-3 gap-3">
        <!-- Card Tu -->
        <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800 text-center relative overflow-hidden group">
          <div class="text-2xl mb-1">👤</div>
          <p class="text-xs font-bold text-slate-300">Tu</p>
          <p id="cnt-Tu" class="text-2xl font-black text-amber-400 mt-0.5">0</p>
          <div id="bar-Tu" class="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
            <div class="bg-amber-400 h-full rounded-full transition-all duration-500" style="width: 33%"></div>
          </div>
        </div>

        <!-- Card Luca -->
        <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800 text-center relative overflow-hidden group">
          <div class="text-2xl mb-1">🧔‍♂️</div>
          <p class="text-xs font-bold text-slate-300">Luca</p>
          <p id="cnt-Luca" class="text-2xl font-black text-amber-400 mt-0.5">0</p>
          <div id="bar-Luca" class="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
            <div class="bg-amber-400 h-full rounded-full transition-all duration-500" style="width: 33%"></div>
          </div>
        </div>

        <!-- Card Fede -->
        <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800 text-center relative overflow-hidden group">
          <div class="text-2xl mb-1">🧑‍🦱</div>
          <p class="text-xs font-bold text-slate-300">Fede</p>
          <p id="cnt-Fede" class="text-2xl font-black text-amber-400 mt-0.5">0</p>
          <div id="bar-Fede" class="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
            <div class="bg-amber-400 h-full rounded-full transition-all duration-500" style="width: 33%"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- PROGRAMMAZIONE PROSSIMI GIORNI -->
    <div class="glass-card rounded-3xl p-5 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-extrabold text-slate-400 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-calendar-days text-amber-400"></i> Prossimi Turni Lavorativi
        </h2>
        <span class="text-[10px] text-slate-500 font-semibold uppercase">Sab & Dom Esclusi</span>
      </div>

      <div id="schedule-container" class="space-y-2 max-h-64 overflow-y-auto custom-scrollbar pr-1">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- FOOTER LINK WA PERMANENTE -->
    <div class="text-center pt-2">
      <button onclick="copyPermanentLink()" class="inline-flex items-center space-x-2 text-xs font-semibold text-slate-400 hover:text-amber-400 transition bg-slate-900/80 py-2 px-4 rounded-xl border border-slate-800">
        <i class="fa-regular fa-copy"></i>
        <span>Copia Link Fisso per Gruppo WhatsApp</span>
      </button>
    </div>

  </main>

  <script>
    const members = ["Tu", "Luca", "Fede"];
    const avatars = { "Tu": "👤", "Luca": "🧔‍♂️", "Fede": "🧑‍🦱" };
    
    // Stato iniziale ancorato al 14 Ottobre 2026 (Mercoledì) -> Pagato da Tu
    let appState = {
      payerIndex: 1, // Prossimo: Luca (Giovedì 15)
      counts: { "Tu": 1, "Luca": 0, "Fede": 0 },
      lastUpdate: new Date().toISOString()
    };

    function isWeekend(date) {
      const day = date.getDay();
      return day === 0 || day === 6;
    }

    function getNextWorkday(startDate, offsetDays = 1) {
      let d = new Date(startDate);
      let count = 0;
      while (count < offsetDays) {
        d.setDate(d.getDate() + 1);
        if (!isWeekend(d)) {
          count++;
        }
      }
      return d;
    }

    function init() {
      // 1. Prova a caricare lo stato dall URL Hash (quando aperto da WhatsApp)
      const hash = window.location.hash.substring(1);
      if (hash) {
        try {
          const decoded = JSON.parse(decodeURIComponent(atob(hash)));
          if (decoded && typeof decoded.payerIndex === 'number' && decoded.counts) {
            appState = decoded;
            localStorage.setItem('caffe_app_saas_v1', JSON.stringify(appState));
          }
        } catch (e) {
          console.error("Errore parsing hash URL", e);
        }
      } else {
        // 2. Altrimenti carica da localStorage
        const local = localStorage.getItem('caffe_app_saas_v1');
        if (local) {
          try {
            appState = JSON.parse(local);
          } catch (e) {}
        }
      }
      renderUI();
    }

    function renderUI() {
      // Data di oggi formattata
      const today = new Date();
      const options = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
      document.getElementById('current-date-str').innerText = today.toLocaleDateString('it-IT', options);

      // Chi paga oggi
      const currentPayer = members[appState.payerIndex];
      document.getElementById('hero-payer').innerText = `${avatars[currentPayer]} ${currentPayer}`;

      // Statistiche
      let total = 0;
      members.forEach(m => {
        const cnt = appState.counts[m] || 0;
        total += cnt;
        document.getElementById(`cnt-${m}`).innerText = cnt;
      });

      document.getElementById('total-coffees-badge').innerText = `${total} Totali`;

      // Barre di percentuale
      members.forEach(m => {
        const cnt = appState.counts[m] || 0;
        const pct = total > 0 ? Math.round((cnt / total) * 100) : 33;
        const bar = document.querySelector(`#bar-${m} div`);
        if (bar) bar.style.width = `${pct}%`;
      });

      // Render Tabella Prossimi Turni
      const scheduleContainer = document.getElementById('schedule-container');
      scheduleContainer.innerHTML = '';

      let dateIter = new Date();
      if (isWeekend(dateIter)) {
        dateIter = getNextWorkday(dateIter, 1);
      }

      let idx = appState.payerIndex;

      for (let i = 0; i < 8; i++) {
        const isTodayRow = (i === 0);
        const dayDate = isTodayRow ? dateIter : getNextWorkday(new Date(), i);
        const dayFormatted = dayDate.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
        const person = members[idx];

        const row = document.createElement('div');
        row.className = `flex justify-between items-center p-3 rounded-2xl border transition ${
          isTodayRow 
            ? 'bg-amber-500/10 border-amber-500/40 text-amber-300 font-bold' 
            : 'bg-slate-900/40 border-slate-800/80 text-slate-300'
        }`;

        row.innerHTML = `
          <div class="flex items-center space-x-3">
            <span class="text-xs px-2 py-0.5 rounded-lg ${isTodayRow ? 'bg-amber-500 text-slate-950 font-black' : 'bg-slate-800 text-slate-400 font-medium'} uppercase">
              ${isTodayRow ? 'Oggi' : dayFormatted}
            </span>
          </div>
          <div class="flex items-center space-x-2">
            <span class="text-sm font-extrabold">${avatars[person]} ${person}</span>
          </div>
        `;

        scheduleContainer.appendChild(row);
        idx = (idx + 1) % members.length;
      }
    }

    function confirmAndShare() {
      const currentPayer = members[appState.payerIndex];
      appState.counts[currentPayer] = (appState.counts[currentPayer] || 0) + 1;
      appState.payerIndex = (appState.payerIndex + 1) % members.length;
      appState.lastUpdate = new Date().toISOString();

      localStorage.setItem('caffe_app_saas_v1', JSON.stringify(appState));
      renderUI();

      // Generazione Hash e Link WA
      const encoded = btoa(encodeURIComponent(JSON.stringify(appState)));
      const baseUrl = window.location.href.split('#')[0];
      const shareUrl = `${baseUrl}#${encoded}`;
      const nextPayer = members[appState.payerIndex];

      const msg = encodeURIComponent(
        `☕ *Barista SaaS - Registro Caffè*\n` +
        `✅ *${currentPayer}* ha appena pagato il caffè!\n` +
        `👉 Prossimo turno: *${nextPayer}*\n\n` +
        `Aggiorna la tua Dashboard:\n${shareUrl}`
      );

      window.location.href = `https://api.whatsapp.com/send?text=${msg}`;
    }

    function skipTurn() {
      appState.payerIndex = (appState.payerIndex + 1) % members.length;
      localStorage.setItem('caffe_app_saas_v1', JSON.stringify(appState));
      renderUI();
    }

    function resetData() {
      if (confirm("Vuoi azzerare lo storico dei caffè e ripartire da zero?")) {
        appState = {
          payerIndex: 0,
          counts: { "Tu": 0, "Luca": 0, "Fede": 0 },
          lastUpdate: new Date().toISOString()
        };
        localStorage.setItem('caffe_app_saas_v1', JSON.stringify(appState));
        window.location.hash = '';
        renderUI();
      }
    }

    function copyPermanentLink() {
      const baseUrl = window.location.href.split('#')[0];
      navigator.clipboard.writeText(baseUrl).then(() => {
        alert("Link di base copiato negli appunti!");
      });
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
