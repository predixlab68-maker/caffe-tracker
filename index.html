<script>
const SUPABASE_URL = 'https://sbqsxhigkmiuoplbdzvc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Z5_SYnmTBbgElcaRne91Qw_Mb31NzY9';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function caricaDati() {
    const { data, error } = await supabase.from('turni_caffe').select('*').order('id', { ascending: true });
    if (error || !data) return;

    const oggi = data[0];
    if (oggi) {
        const payerEl = document.getElementById('hero-payer');
        const dateEl = document.getElementById('current-date-str');
        if (payerEl) payerEl.innerText = oggi.chi_paga;
        if (dateEl) dateEl.innerText = oggi.giorno + ' ' + oggi.data;
    }
}

supabase.channel('public:turni_caffe')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'turni_caffe' }, () => {
        caricaDati();
    })
    .subscribe();

caricaDati();
</script>
